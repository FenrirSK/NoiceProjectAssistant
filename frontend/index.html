<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Veyra</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<div class="container">

    <header class="header">
        <div class="logo">Veyra</div>
        <p class="subtitle">
            Voice-powered project assistant
        </p>
    </header>


    <section class="voice-section">

        <button id="recordButton">
            🎙️ Start Recording
        </button>

        <div id="statusIndicator">
            <span id="statusDot"></span>
            <span id="status">Ready</span>
        </div>

    </section>


    <section class="results">

        <div class="card">
            <h2>Recognized Command</h2>

            <p id="result">
                —
            </p>
        </div>


        <div class="card">

            <h2>Understanding</h2>

            <div class="entity-grid">

                <div class="entity">
                    <strong>Intent</strong>
                    <span id="intent">—</span>
                </div>

                <div class="entity">
                    <strong>Entities</strong>
                    <span id="entities">—</span>
                </div>

            </div>

        </div>


        <div class="card">

            <h2>Veyra Response</h2>

            <p id="command">
                —
            </p>

        </div>


        <div class="card">

            <h2>Search Results</h2>

            <div id="searchResults">
                No search performed yet.
            </div>

        </div>

    </section>

</div>


<script src="js/app.js"></script>
```

</body>
</html>
